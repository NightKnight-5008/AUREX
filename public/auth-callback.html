<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completing Authentication...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: hsl(0 0% 100%);
      color: hsl(0 0% 3.9%);
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: hsl(0 0% 3.9%);
        color: hsl(0 0% 98%);
      }
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 1.5rem;
      border: 4px solid hsl(0 0% 90%);
      border-top-color: hsl(221.2 83.2% 53.3%);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @media (prefers-color-scheme: dark) {
      .spinner {
        border-color: hsl(0 0% 14.9%);
        border-top-color: hsl(217.2 91.2% 59.8%);
      }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.875rem;
      color: hsl(0 0% 45.1%);
    }

    @media (prefers-color-scheme: dark) {
      p {
        color: hsl(0 0% 63.9%);
      }
    }

    .error {
      color: hsl(0 84.2% 60.2%);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1 id="status">Completing authentication...</h1>
    <p id="message">This window will close automatically.</p>
  </div>

  <script type="module">
    // Import SecureStorage for encrypted token storage
    import { SecureStorage } from '../src/lib/security/SecureStorage.ts';

    // OAuth callback handler
    (async function handleCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');

      const statusEl = document.getElementById('status');
      const messageEl = document.getElementById('message');

      // Handle error from OAuth provider
      if (error) {
        sessionStorage.setItem('google_oauth_error', error);
        statusEl.textContent = 'Authentication failed';
        messageEl.textContent = error;
        messageEl.classList.add('error');
        setTimeout(() => window.close(), 3000);
        return;
      }

      // Validate required parameters
      if (!code || !state) {
        sessionStorage.setItem('google_oauth_error', 'Invalid callback parameters');
        statusEl.textContent = 'Authentication failed';
        messageEl.textContent = 'Invalid callback parameters';
        messageEl.classList.add('error');
        setTimeout(() => window.close(), 3000);
        return;
      }

      // Retrieve PKCE data
      const pkceDataStr = sessionStorage.getItem('google_oauth_pkce');
      if (!pkceDataStr) {
        sessionStorage.setItem('google_oauth_error', 'PKCE data not found');
        statusEl.textContent = 'Authentication failed';
        messageEl.textContent = 'Session expired. Please try again.';
        messageEl.classList.add('error');
        setTimeout(() => window.close(), 3000);
        return;
      }

      let pkceData;
      try {
        pkceData = JSON.parse(pkceDataStr);
      } catch {
        sessionStorage.setItem('google_oauth_error', 'Invalid PKCE data');
        statusEl.textContent = 'Authentication failed';
        messageEl.textContent = 'Invalid session data';
        messageEl.classList.add('error');
        setTimeout(() => window.close(), 3000);
        return;
      }

      // Validate state (CSRF protection)
      if (state !== pkceData.state) {
        sessionStorage.setItem('google_oauth_error', 'Invalid state parameter');
        statusEl.textContent = 'Authentication failed';
        messageEl.textContent = 'Security validation failed';
        messageEl.classList.add('error');
        setTimeout(() => window.close(), 3000);
        return;
      }

      // Check PKCE data age (max 10 minutes)
      if (Date.now() - pkceData.timestamp > 10 * 60 * 1000) {
        sessionStorage.setItem('google_oauth_error', 'PKCE data expired');
        statusEl.textContent = 'Authentication failed';
        messageEl.textContent = 'Session expired. Please try again.';
        messageEl.classList.add('error');
        setTimeout(() => window.close(), 3000);
        return;
      }

      try {
        // Get client ID
        const clientId = import.meta.env.VITE_GOOGLE_CLIENT_ID;
        if (!clientId) {
          throw new Error('Google Client ID not configured');
        }

        // Get redirect URI
        const redirectUri = import.meta.env.VITE_GOOGLE_REDIRECT_URI || `${window.location.origin}/auth-callback.html`;

        // Exchange code for token
        const response = await fetch('https://oauth2.googleapis.com/token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: new URLSearchParams({
            client_id: clientId,
            redirect_uri: redirectUri,
            grant_type: 'authorization_code',
            code: code,
            code_verifier: pkceData.codeVerifier
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error_description || 'Token exchange failed');
        }

        const tokens = await response.json();

        // Store token via SecureStorage (encrypted)
        const tokenMetadata = {
          service: `google-${pkceData.serviceType}`,
          accessToken: tokens.access_token,
          refreshToken: tokens.refresh_token,
          expiresAt: Date.now() + (tokens.expires_in * 1000),
          scope: tokens.scope.split(' ') // Convert space-separated string to array
        };

        await SecureStorage.setOAuthToken(`google_${pkceData.serviceType}`, tokenMetadata);
        await SecureStorage.setPreference(`google_${pkceData.serviceType}_connected`, true);
        await SecureStorage.setPreference(`google_${pkceData.serviceType}_connected_at`, new Date().toISOString());

        // Clean up PKCE data
        sessionStorage.removeItem('google_oauth_pkce');

        // Signal success
        sessionStorage.setItem('google_oauth_success', 'true');

        // Update UI
        statusEl.textContent = 'Authentication successful!';
        messageEl.textContent = 'Closing window...';

        // Close popup
        setTimeout(() => window.close(), 1000);
      } catch (error) {
        const errorMessage = error.message || 'Token exchange failed';
        sessionStorage.setItem('google_oauth_error', errorMessage);
        statusEl.textContent = 'Authentication failed';
        messageEl.textContent = errorMessage;
        messageEl.classList.add('error');
        setTimeout(() => window.close(), 3000);
      }
    })();
  </script>
</body>
</html>
