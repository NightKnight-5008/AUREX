<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple monochrome design for system tray -->
  <defs>
    <linearGradient id="trayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#trayGradient)"/>
  
  <!-- Simplified "A" -->
  <g transform="translate(32, 32)">
    <path d="M -12 15 L 0 -15 L 12 15 L 8 15 L 0 -5 L -8 15 Z" 
          fill="#ffffff"/>
    <rect x="-6" y="2" width="12" height="3" fill="#fbbf24" rx="1"/>
  </g>
</svg>
